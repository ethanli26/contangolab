[project]
name = "contangolab"
version = "2.0.0"
description = "What futures curves say about commodity markets: China vs US, 95 markets, one pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ethan Li" }]
license = { text = "MIT" }
dependencies = ["pandas", "numpy", "scipy", "matplotlib", "pyarrow", "xgboost", "scikit-learn", "python-dotenv", "requests", "xlrd"]

[project.optional-dependencies]
data = ["databento"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.scripts]
contangolab = "contangolab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contangolab*"]

[tool.coverage.run]
source = ["contangolab"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, warnings, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# zip() over consecutive rebalance dates is length-mismatched on purpose (dates[:-1], dates[1:])
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["contangolab"]
